name: Mobile — iOS (TestFlight)

# Builds and uploads the DinnerDrop iOS app from apps/mobile on a macOS runner.
# Requires (GitHub secrets) once the Apple Developer enrollment is approved:
#   APPLE_TEAM_ID                  – 10-char team ID from developer.apple.com
#   APP_STORE_CONNECT_KEY_ID       – App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID    – App Store Connect API issuer ID
#   APP_STORE_CONNECT_KEY_P8       – the full text of the AuthKey_XXXX.p8 file (BEGIN…END lines included)
#   (APP_STORE_CONNECT_KEY_P8_B64 – base64 of the .p8 – still accepted as an alternative)
# Signing uses Xcode's automatic cloud signing with the API key, so no
# certificates or provisioning profiles need to be exported by hand.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after archiving (true/false)
        required: false
        default: 'true'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          OUT=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          if [ -n "$P8" ]; then printf '%s\n' "$P8" > "$OUT"; else echo "$P8_B64" | base64 -d > "$OUT"; fi
          grep -q "BEGIN PRIVATE KEY" "$OUT" || { echo "App Store Connect key secret is missing or malformed"; exit 1; }
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> $GITHUB_ENV

      - name: Set build number
        run: |
          cd ios/App
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:|warning: .*(sign|provision)|Signing|No profiles|requires a development team" "$RUNNER_TEMP/archive.log" | tail -40; tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: dinnerdrop-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
