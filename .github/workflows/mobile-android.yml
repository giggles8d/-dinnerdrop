name: Mobile — Android (AAB)

# Builds the DinnerDrop Android app bundle from apps/mobile.
# - Always produces a release AAB as a workflow artifact.
# - Signs with the upload keystore when the ANDROID_KEYSTORE_B64 /
#   ANDROID_KEYSTORE_PASSWORD secrets exist (required for Play Console).
# - If PLAY_SERVICE_ACCOUNT_JSON exists, uploads to the Play "internal" track
#   (or the track given via workflow_dispatch) — e.g. "alpha" for closed testing.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to (internal | alpha | beta | production). Leave blank to only build.
        required: false
        default: ''
  push:
    branches: [main, feat/mobile-shell]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Version from run number
        run: |
          # versionCode must increase on every Play upload; use the workflow run number.
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Decode upload keystore
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.keystore

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/upload.keystore ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/upload.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=dinnerdrop-upload \
              -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::No keystore secret — building an UNSIGNED bundle (cannot be uploaded to Play)."
            ./gradlew bundleRelease
          fi
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: dinnerdrop-android-aab-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ github.event.inputs.track != '' && env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dinnerdrop.mobile
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
