<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DinnerDrop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #FBF8F1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #1a5c38; text-align: center; padding: 24px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #e8a838; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: #666; font-size: 14px; }
      a { color: #1a5c38; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- Only shown if the remote app cannot be reached (offline on first launch). -->
    <div class="wrap">
      <div class="dot"></div>
      <h1>DinnerDrop</h1>
      <p>Connect to the internet to load this week's dinners.</p>
      <p><a href="https://www.dinnerdrop.app/dashboard">Try again</a></p>
    </div>
  </body>
</html>
